<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 787 762" width="787" height="762" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Warren supports caller-owned GPU rendering: Component diagram for Electrobun SDK and the external Glyph integration used for validation</title><desc id="dg-desc">Component diagram for Electrobun SDK and the external Glyph integration used for validation. 6 elements: Warren mount (component, changed), Layout and paint (component, changed), Built-in renderer (component, changed), Caller-owned renderer (external component, affected), Native WebGPU adapter (component, changed), Native GPU and drawable (component). 7 relationships: Warren mount to Layout and paint: Lays out nodes with renderer text metrics (changed); Warren mount to Built-in renderer: Selects the default renderer (changed); Warren mount to Caller-owned renderer: Accepts a renderer and awaits its first frame (added); Layout and paint to Caller-owned renderer: Supplies ordered quads, text runs, and clips (added); Built-in renderer to Native WebGPU adapter: Submits frames at the display scale (changed); Caller-owned renderer to Native WebGPU adapter: Uploads glyph data and submits Slug draws (added); Native WebGPU adapter to Native GPU and drawable: Forwards commands and GPU completion (changed).</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}