<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 782" width="724" height="782" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Native WebGPU normalizes inputs and forwards GPU callbacks: Component diagram for the Electrobun JavaScript adapter and its native FFI boundary</title><desc id="dg-desc">Component diagram for the Electrobun JavaScript adapter and its native FFI boundary. 5 elements: WebGPU consumer (external component, affected), Native WebGPU adapter (component, changed), Buffer source range (component, added), Texture extent (component, added), Native WebGPU implementation (component). 4 relationships: WebGPU consumer to Native WebGPU adapter: Submits uploads, pipelines, and readback requests (changed); Native WebGPU adapter to Buffer source range: Resolves the selected bytes for writeBuffer (added); Native WebGPU adapter to Texture extent: Resolves texture dimensions and defaults (added); Native WebGPU adapter to Native WebGPU implementation: Forwards GPU operations and dispatches completion callbacks (changed).</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.t