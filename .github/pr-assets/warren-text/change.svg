<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 724 526" width="724" height="526" role="img" aria-labelledby="dg-title dg-desc"><title id="dg-title">Warren: optional text backend: Component diagram for Warren UI SDK — text extension</title><desc id="dg-desc">Component diagram for Warren UI SDK — text extension. 4 elements: UI mount (component, changed), Layout (component, changed), Warren renderer (component, changed), Application text backend (external component, added). 3 relationships: UI mount to Application text backend: Creates with borrowed device; disposes before teardown (added); Layout to Application text backend: Measures text for layout (added); Warren renderer to Application text backend: Prepares runs, then draws within the existing pass (added).</desc><style>:root{--bg:#ffffff;--frame:#d1d9e0;--fg:#1f2328;--muted:#57606a;--line:#57606a;--stroke:#7d8894;--person:#e9e5fb;--system:#d3e5fb;--container:#e2eefc;--component:#f0f6fd;--store:#dbf1f0;--external:#eaeef2;--group:#f6f8fa;--added:#1a7f37;--changed:#9a6700;--removed:#cf222e;--affected:#0969da;--on-status:#ffffff}@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--frame:#3d444d;--fg:#f0f6fc;--muted:#a9b4c0;--line:#a9b4c0;--stroke:#7a8696;--person:#2b2652;--system:#17325c;--container:#172a47;--component:#161f30;--store:#12323a;--external:#272d36;--group:#12171e;--added:#3fb950;--changed:#d29922;--removed:#f85149;--affected:#58a6ff;--on-status:#0d1117}}text{font-family:-apple-system, "Segoe UI", Helvetica, Arial, sans-serif;fill:var(--fg)}.bg{fill:var(--bg);stroke:var(--frame)}.title{font-size:18px;font-weight:600}.sub{font-size:12.5px;fill:var(--muted)}.nm{font-size:14px;font-weight:600;text-anchor:middle}.ty{font-size:11px;fill:var(--muted);text-anchor:middle}.ds{font-size:12px;text-anchor:middle}.gn{font-size:13px;font-weight:600}.gk{font-size:10.5px;font-weight:400;fill:var(--muted)}.el{font-size:11.5px;font-weight:500;text-anchor:middle}.et{font-size:10px;fill:var(--muted);text-anchor:middle}.kh{font-size:10px;font-weight:600;letter-spacing:.08em;fill:var(--muted)}.kt{font-size:11.5px}.sh{stroke:var(--stroke);stroke-width:1.25;stroke-linejoin:round}.f-person{fill:var(--person)}.f-system{fill:var(--system)}.f-container{fill:var(--container)}.f-component{fill:var(--component)}.f-store{fill:var(--store)}.f-external{fill:var(--external)}.f-group{fill:var(--group)}.f-bg{fill:var(--bg)}.dt{fill:none}.grp{stroke-dasharray:6 4}.glyph{fill:var(--stroke)}.s-added{stroke:var(--added);stroke-width:3;stroke-dasharray:none}.s-changed{stroke:var(--changed);stroke-width:2.5;stroke-dasharray:9 5}.s-removed{stroke:var(--removed);stroke-width:2.5;stroke-dasharray:1.5 5.5;stroke-linecap:round}.s-affected{stroke:var(--affected);stroke-width:1.5;stroke-dasharray:none}.ring{fill:none;stroke:var(--affected);stroke-width:1.5}.gone{opacity:.72}.strike{stroke:var(--fg);stroke-width:1.2}.bt{font-size:9.5px;font-weight:700;letter-spacing:.03em;text-anchor:middle;fill:var(--on-status)}.b-added{fill:var(--added)}.m-added{fill:var(--added);font-weight:700}.b-changed{fill:var(--changed)}.m-changed{fill:var(--changed);font-weight:700}.b-removed{fill:var(--removed)}.m-removed{fill:var(--removed);font-weight:700}.b-affected{fill:var(--affected)}.m-affected{fill:var(--affected);font-weight:700}.e{fill:none;stroke:var(--line);stroke-width:1.4;stroke-linejoin:round}.ah{fill:var(--line)}.e-added{stroke:var(--added);stroke-width:2.6}.e-changed{stroke:var(--changed);stroke-width:2;stroke-dasharray:8 5}.e-removed{stroke:var(--removed);stroke-width:2;stroke-dasharray:1.5 5;stroke-linecap:round}.e-affected{stroke:var(--affected);stroke-width:1.8;stroke-dasharray:12 4 2 4}.halo{fill:var(--bg);opacity:.94}.rule{stroke:var(--frame)}.fd{font-size:12px;fill:var(--muted)}.fs{font-size:10.5px;fill:var(--muted)}.fb{font-size:12px;font-weight:600;fill:var(--fg)}.fn{font-size:11px;fill:var(--muted)}.sy{font-family:ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;font-size:11.5px}.sk{font-size:10px;fill:var(--muted);text-anchor:end}.sm{font-size:13px;text-anchor:middle}.card{stroke:var(--stroke);stroke-width:1}.lane{fill:var(--group)}.ln{font-size:10.5px;font-weight:600;letter-spacing:.06em;fill:var(--muted)}.num{fill:var(--bg);stroke:var(--line);stroke-width:1.2}.en{font-size:11px;font-weight:700;text-anchor:middle}.n-added{stroke:var(--added);stroke-width:2}.n-changed{stroke:var(--changed);stroke-width:2}.n-removed{stroke:var(--removed);stroke-width:2}.n-affected{stroke:var(--affected);stroke-width:2}</style><rect class="bg" x="0.5" y="0.5" width="723" height="525" rx="12"/><text class="title" x="24" y="44">Warren: optional text backend</text><text class="sub" x="24" y="64">Component diagram for Warren UI SDK — text extension</text><g transform="translate(24 84)"><path class="e e-added" d="M104 104L104 205Q104 212 111 212L279.5 212Q286 212 286 218.5L286 225"/><path class="b-added" d="M286 232L281.8 223L290.2 223z"/><path class="e e-added" d="M338 104L338 225"/><path class="b-added" d="M338 232L333.8 223L342.2 223z"/><path class="e e-added" d="M572 104L572 205Q572 212 565 212L396.5 212Q390 212 390 218.5L390 225"/><path class="b-added" d="M390 232L385.8 223L394.2 223z"/><rect class="sh f-component s-changed" x="0" y="0" width="208" height="104" rx="7"/><text class="nm" x="104" y="33.5">UI mount</text><text class="ty" x="104" y="49.5">[Component: TypeScript]</text><text class="ds" x="104" y="70.5">Owns the device and</text><text class="ds" x="104" y="86.5">per-mount backend</text><rect class="b-changed" x="123" y="5" width="79" height="16" rx="8"/><text class="bt" x="162.5" y="16.4">~ CHANGED</text><rect class="sh f-component s-changed" x="234" y="0" width="208" height="104" rx="7"/><text class="nm" x="338" y="33.5">Layout</text><text class="ty" x="338" y="49.5">[Component: TypeScript]</text><text class="ds" x="338" y="70.5">Places retained JSX text in</text><text class="ds" x="338" y="86.5">logical points</text><rect class="b-changed" x="357" y="